<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Guess the Color</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .instruction {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .color-box {
            width: 400px;
            height: 400px;
            background-color: #89afca;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .countdown-circle {
            width: 64px;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
        }

        .progress-container {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 50px;
        }

        .progress-segment {
            height: 4px;
            flex: 1;
            background-color: #dee2e6;
            border-radius: 2px;
        }

        .progress-segment.active {
            background-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header">
            <h1 th:text="|Round ${roundIndex + 1} of 5|">Round 1 of 5</h1>
        </div>

        <div class="instruction" id="instruction-text">
            Memorize this color — you have 3s!
        </div>

        <div class="color-box" th:style="|background-color: rgb(${targetR}, ${targetG}, ${targetB})|">
            <div class="countdown-circle" id="countdown-number">3</div>
        </div>

        <div class="progress-container">
            <div class="progress-segment" th:each="i : ${#numbers.sequence(0,4)}"
                    th:classappend="${i<=roundIndex} ? 'active' : ''">
            </div>
        </div>
    </div>

    <script>
        let roundIndex = [[${roundIndex}]];
        let timeLeft = 3;

        const countdownElement = document.getElementById('countdown-number');
        const instructionElement = document.getElementById('instruction-text');

        const timer = setInterval(() => {
            timeLeft--;

            if (timeLeft > 0) {
                countdownElement.textContent = timeLeft;
                instructionElement.textContent = `Memorize this color — you have ${timeLeft}s!`;
            } else {
                clearInterval(timer);
                countdownElement.textContent = "0";
                window.location.href = '/daily/play/' + roundIndex + '/guess';
            }
        }, 1000);
    </script>
</body>
</html>
