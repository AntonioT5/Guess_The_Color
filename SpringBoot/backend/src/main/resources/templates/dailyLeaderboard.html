<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Daily Leaderboard</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f6f8;
            color: #333333;
        }
        .page-wrapper {
            display: flex;
            justify-content: flex-start;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 24px;
        }
        .profile-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5%;
        }
        .user-details h2 {
            margin: 0 0 4px 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            border: 1px solid #ced4da;
            background-color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            color: #495057;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #f8f9fa;
            border-color: #adb5bd;
            color: #212529;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .leaderboard-row {
            align-self: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-direction: row;
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 20px 24px;
            transition: all 0.4s;
        }
        .leaderboard-row:hover {
            transform: translateY(-5px);
        }
        .rank-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .rank {
            font-size: 18px;
            font-weight: 700;
            color: #6c757d;
            width: 30px;
        }
        .username {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .score {
            font-size: 18px;
            font-weight: 700;
            color: #7b42f6;
        }
    </style>
</head>
<body>
<div class="page-wrapper">

    <div class="dashboard-container">
        <div class="card profile-section">
            <div class="user-details">
                <h2>Today's Leaderboard</h2>
            </div>
            <div class="action-buttons">
                <a href="/home" style="text-decoration:none;text-align:center;" class="btn">Go Back</a>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="leaderboard-row" th:each="attempt, i : ${leaderboard}">
            <div class="rank-user">
                <span class="rank" th:text="|${currentPage * 10 + i.index + 1}|"></span>
                <span class="username" th:text="${attempt.user.username}"></span>
            </div>
            <span class="score" th:text="${#numbers.formatDecimal(attempt.totalScore, 1, 2)}"></span>
        </div>
    </div>

    <div class="dashboard-container" style="margin-top:10px; flex-direction: row; justify-content: center; gap: 10px;" th:if="${totalPages > 1}">
        <a th:if="${hasPrevious}" th:href="@{/daily/leaderboard(page=${currentPage - 1})}" class="btn"
           style="text-decoration:none;">Previous</a>

        <span style="align-self:center; font-size:14px; color:#6c757d;"
              th:text="|Page ${currentPage + 1} of ${totalPages}|"></span>

        <a th:if="${hasNext}" th:href="@{/daily/leaderboard(page=${currentPage + 1})}"
           class="btn" style="text-decoration:none;">Next</a>
    </div>

</div>
</body>
</html>
