<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Guess the Color - Edit Profile</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f4f6f8;
      color: #333333;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #6c757d;
      font-size: 15px;
      margin-top: 8px;
    }

    .edit-card {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .back{
      width: 100%;
      max-width: 400px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    .back a{
      color: #6c757d;
      text-decoration: none;
      text-decoration-color: transparent;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .back a:hover{
      text-decoration: underline;
      color: #1a1a1a;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      margin-left: 2px;
    }

    input {
      background-color: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 12px;
      color: #1a1a1a;
      height: 50px;
      padding: 0 16px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      background-color: #0d6efd;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #0b5ed7;
    }

    .error-alert {
      color: #e11d48;
      padding: 12px 15px;
      font-size: 14px;
      text-align: center;
      margin-top: 5px;
      font-weight: 500;
    }

  </style>
</head>
<body>
<div class="page-wrapper">

  <div class="back">
    <a href="/home">Go Back</a>
  </div>

  <div class="header">
    <h1>Edit Profile</h1>
    <p>Update your personal info</p>
  </div>

  <div class="edit-card">
    
    <form th:action="@{/edit}" method="post">
      <div class="input-group">
        <label>Display Username</label>
        <input type="text" name="username" th:value="${username}">
      </div>
      <input type="hidden" name="oldUsername" th:value="${username}">
      <input type="hidden" name="oldMail" th:value="${mail}">
      <div class="input-group">
        <label>Mail</label>
        <input type="text" name="mail" th:value="${mail}">
      </div>
      <button class="submit-btn">Save Changes</button>
    </form>

    <div class="error-alert" th:if="${error!=null}" th:text="${error}"></div>
  </div>
</div>
</body>
</html>
