<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Guess the Color - Edit Profile</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f4f6f8;
      color: #333333;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #6c757d;
      font-size: 15px;
      margin-top: 8px;
    }

    .edit-card {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .back{
      width: 100%;
      max-width: 400px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    .back a{
      color: #6c757d;
      text-decoration: none;
      text-decoration-color: transparent;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .back a:hover{
      text-decoration: underline;
      color: #1a1a1a;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      margin-left: 2px;
    }

    input {
      background-color: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 12px;
      color: #1a1a1a;
      height: 50px;
      padding: 0 16px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .submit-btn {
      flex: 1;
      width: 100%;
      height: 50px;
      background-color: #0d6efd;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      padding: 0;
      align-items: center;
      transition: background-color 0.2s ease;
      margin-top: 10px;
      text-decoration: none;
    }

    .submit-btn:hover {
      background-color: #0b5ed7;
    }

    .error-alert {
      color: #e11d48;
      padding: 12px 15px;
      font-size: 14px;
      text-align: center;
      margin-top: 5px;
      font-weight: 500;
    }

    .delete-btn{
      background-color: #e11d48;
    }

    #openModalBtn:hover{
      background-color: #cc1a40;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .modal-box {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-box h2 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 22px;
    }

    .modal-box p {
      color: #6c757d;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .modal-actions {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 15px;
    }
    
    .modal-actions .submit-btn {
      margin-top: 0; 
    }
    
    .cancel-btn {
      background-color: #e5e7eb;
      color: #333333;
    }

    .cancel-btn:hover {
      background-color: #d1d5db;
    }

    .delete-btn:hover{
      background-color: #cc1a40;
    }

  </style>
</head>
<body>
<div class="page-wrapper">

  <div class="back">
    <a href="/home">Go Back</a>
  </div>

  <div class="header">
    <h1>Edit Profile</h1>
    <p>Update your personal info</p>
  </div>

  <div class="edit-card">
    
    <form th:action="@{/edit}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="input-group">
        <label>Display Username</label>
        <input type="text" name="username" th:value="${username}">
      </div>
      <input type="hidden" name="oldUsername" th:value="${username}">
      <input type="hidden" name="oldMail" th:value="${mail}">
      <div class="input-group">
        <label>Mail</label>
        <input type="text" name="mail" th:value="${mail}">
      </div>
      <div sec:authorize="hasRole('USER')" style="display: flex; gap: 20px; justify-content: center; align-items: center;">
        <button class="submit-btn">Save Changes</button>
        <button type="button" id="openModalBtn" class="submit-btn delete-btn">Delete Account</button>
      </div>
      <div sec:authorize="hasRole('ADMIN')" style="display: flex; gap: 20px; justify-content: center; align-items: center;">
        <button class="submit-btn">Save Changes</button>
      </div>
    </form>

    <div class="error-alert" th:if="${error!=null}" th:text="${error}"></div>
  </div>
</div>

<div id="deleteModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Delete Account?</h2>
    <p>Are you sure you want to delete your account? All of your data will be permenently removed. This action cannot be undone.</p>

    <div class="modal-actions">
      <button type="button" id="closeModalBtn" class="submit-btn cancel-btn">No, Keep It</button>

      <form th:action="@{/edit/delete}" method="post" style="flex: 1; margin: 0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="submit-btn delete-btn">Yes, Delete</button>
      </form>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById("deleteModal");
  const openBTN = document.getElementById("openModalBtn");
  const closeBTN = document.getElementById("closeModalBtn");

  if(openBTN){
    openBTN.addEventListener('click', function(){
    modal.style.display = 'flex';
  })
  }

  closeBTN.addEventListener('click', function() {
    modal.style.display = 'none';
  });

  window.addEventListener('click', function(event){
    if(event.target === modal){
      modal.style.display = 'none';
    }
  })
</script>
</body>
</html>
