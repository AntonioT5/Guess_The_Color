<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Guess the Color</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .boxes-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .box-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 100%;
            height: 100px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .box-label {
            font-size: 12px;
            font-weight: 700;
            color: #6c757d;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        .score-container {
            text-align: center;
            margin-bottom: 35px;
        }

        .score-number {
            font-size: 72px;
            font-weight: 800;
            color: #0d6efd;
            line-height: 1;
            margin-bottom: 5px;
        }

        .progress-container {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-bottom: 25px;
        }

        .progress-segment {
            height: 4px;
            flex: 1;
            background-color: #dee2e6;
            border-radius: 2px;
        }

        .progress-segment.active {
            background-color: #0d6efd;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            background-color: #0d6efd;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">

        <div class="header">
            <h1 th:text="|Round ${roundIndex+1} result|">Round 0 result</h1>
        </div>

        <div class="boxes-container">
            <div class="box-column">
                <div class="color-box" th:style="|background-color: rgb(${round.targetR}, ${round.targetG}, ${round.targetB})|"></div>
                <div class="box-label">TARGET</div>
            </div>
            <div class="box-column">
                <div class="color-box" th:style="|background-color: rgb(${round.guessR}, ${round.guessG}, ${round.guessB})|"></div>
                <div class="box-label">YOUR COLOR</div>
            </div>
        </div>

        <div class="score-container">
            <div class="score-number" th:text="${#numbers.formatDecimal(round.score, 1, 2)}"></div>
        </div>

        <div class="progress-container">
            <div class="progress-segment" th:each="i : ${#numbers.sequence(0,4)}"
                    th:classappend="${i<=roundIndex} ? 'active' : ''">
            </div>
        </div>
        
        <div th:if="${!isLastRound}">
            <form th:action="@{/daily/play/{roundIndex}(roundIndex=${roundIndex + 1})}"
                method="get"
                style="margin:0;">
                <button class="submit-btn">
                    Round <span th:text="${roundIndex+1}"></span> of 5
                </button>
            </form>
        </div>

        <div th:if="${isLastRound}">
            <form th:action="@{/daily/final}"
                method="get"
                style="margin:0;">
                <button class="submit-btn">
                    Submit your last round
                </button>
            </form>
        </div>

    </div>
</body>
</html>
